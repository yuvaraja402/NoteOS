name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python -m compileall app
      - run: python -m unittest discover -s tests
      - run: alembic upgrade head
      - run: python -c "from app.main import app; print(app.title)"

  security:
    runs-on: ubuntu-latest
    needs: [web, api]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s infra/scripts/tests
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@dc5a429b52fcf669ce959baa2c2dd26090d2a6c4 # v0.32.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          format: sarif
          output: trivy-fs.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Upload Trivy filesystem SARIF
        if: ${{ always() && github.event_name == 'push' }}
        uses: github/codeql-action/upload-sarif@87ef0dc97def48aa960fbf026a2563ee9dbdb470 # v3
        with:
          sarif_file: trivy-fs.sarif

  snyk:
    # PR code has no access to AWS or SSM. Main pushes require Snyk configuration.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    needs: [web, api]
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ca-central-1' }}
      AWS_CI_ROLE_ARN: ${{ vars.AWS_CI_ROLE_ARN }}
      SNYK_TOKEN_SSM_PARAMETER: ${{ vars.SNYK_TOKEN_SSM_PARAMETER || '/noteos/ci/snyk-token' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check OIDC configuration
        run: |
          if [ -z "$AWS_CI_ROLE_ARN" ]; then
            echo "::error::Set the AWS_CI_ROLE_ARN repository variable. See infra/README.md."
            exit 1
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install scanner and dependencies
        run: |
          npm install --global snyk@1.1307.4
          npm ci --prefix frontend --ignore-scripts
          pip install -r backend/requirements.txt
      - name: Assume read-only CI role using OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ env.AWS_CI_ROLE_ARN }}
          role-session-name: noteos-ci-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 900
          mask-aws-account-id: true
          unset-current-credentials: true
      - name: Load Snyk token from SSM SecureString
        run: python3 infra/scripts/load_ci_secret.py "$SNYK_TOKEN_SSM_PARAMETER" SNYK_TOKEN
      - name: Snyk frontend dependency scan
        working-directory: frontend
        run: snyk test --severity-threshold=high --file=package.json
      - name: Snyk backend dependency scan
        working-directory: backend
        run: snyk test --severity-threshold=high --file=requirements.txt --package-manager=pip --command=python3

  docker:
    runs-on: ubuntu-latest
    needs: [security, snyk]
    if: ${{ !cancelled() && needs.security.result == 'success' && (needs.snyk.result == 'success' || needs.snyk.result == 'skipped') }}
    strategy:
      matrix:
        image:
          - name: noteos-web
            context: ./frontend
            file: ./frontend/Dockerfile
          - name: noteos-api
            context: ./backend
            file: ./backend/Dockerfile
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build both architectures
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          platforms: linux/amd64,linux/arm64
          push: false
          tags: ${{ matrix.image.name }}:ci
      - name: Build local image for Trivy
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          platforms: linux/amd64
          load: true
          tags: ${{ matrix.image.name }}:scan
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@dc5a429b52fcf669ce959baa2c2dd26090d2a6c4 # v0.32.0
        with:
          image-ref: ${{ matrix.image.name }}:scan
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  terraform:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        root: [infra/terraform, infra/terraform/ci-bootstrap]
    defaults:
      run:
        working-directory: ${{ matrix.root }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
      - run: terraform fmt -check
      - run: terraform init -backend=false
      - run: terraform validate

