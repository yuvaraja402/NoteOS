  #       with:
  #         role-to-assume: ${{ vars.AWS_ARGOCD_ROLE_ARN }}
  #         aws-region: ${{ vars.AWS_REGION || 'ca-central-1' }}
  #     - run: python3 infra/scripts/load_ci_secret.py "$ARGOCD_TOKEN_SSM_PARAMETER" ARGOCD_AUTH_TOKEN
  #       env:
  #         ARGOCD_TOKEN_SSM_PARAMETER: ${{ vars.ARGOCD_TOKEN_SSM_PARAMETER }}
  #     - run: argocd app sync noteos --grpc-web
  #       env:
  #         ARGOCD_SERVER: ${{ vars.ARGOCD_SERVER }}
