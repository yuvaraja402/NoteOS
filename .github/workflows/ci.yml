# Validation only on every branch: no image publication, Terraform apply, or CD.
# Production promotion is a separate reviewed operation; see infra/DEPLOYMENT.md.
name: ci

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: pip install -r requirements-test.txt
      - run: python -m compileall app
      - run: python -m unittest discover -s tests
      - run: python -c "from app.main import app; print(app.title)"

  security:
    runs-on: ubuntu-latest
    needs: [web, api]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s infra/scripts/tests
      - name: Snyk setup status
        if: ${{ vars.ENABLE_SNYK != 'true' }}
        run: echo 'Snyk is disabled. Configure AWS OIDC and the SSM token, then set ENABLE_SNYK=true. Trivy remains enabled.'
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_INCLUDE_DEV_DEPS: "true"
        with:
          version: v0.75.0
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          format: sarif
          output: trivy-fs.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Upload Trivy filesystem SARIF
        if: ${{ always() && github.event_name == 'push' && github.event.repository.private == false && hashFiles('trivy-fs.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@87ef0dc97def48aa960fbf026a2563ee9dbdb470 # v3
        with:
          sarif_file: trivy-fs.sarif

  snyk:
    # Feature branches and PRs have no AWS/SSM access. This main-only role can
    # read the Snyk SecureString, not deploy. Do not broaden its trust for previews.
    # Fresh forks need no AWS setup. Enable this scan before a production release.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_SNYK == 'true' }}
    runs-on: ubuntu-latest
    needs: [web, api]
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ca-central-1' }}
      AWS_CI_ROLE_ARN: ${{ vars.AWS_CI_ROLE_ARN }}
      SNYK_TOKEN_SSM_PARAMETER: ${{ vars.SNYK_TOKEN_SSM_PARAMETER || '/noteos/ci/snyk-token' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check OIDC configuration
        run: |
          if [ -z "$AWS_CI_ROLE_ARN" ]; then
            echo "::error::Set the AWS_CI_ROLE_ARN repository variable. See infra/README.md."
            exit 1
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install scanner and dependencies
        run: |
          npm install --global snyk@1.1307.4
          npm ci --prefix frontend --ignore-scripts
          pip install -r backend/requirements.txt
      - name: Assume read-only CI role using OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ env.AWS_CI_ROLE_ARN }}
          role-session-name: noteos-ci-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 900
          mask-aws-account-id: true
          unset-current-credentials: true
      - name: Load Snyk token from SSM SecureString
        run: python3 infra/scripts/load_ci_secret.py "$SNYK_TOKEN_SSM_PARAMETER" SNYK_TOKEN
      - name: Snyk frontend dependency scan
        working-directory: frontend
        run: snyk test --severity-threshold=high --file=package.json
      - name: Snyk backend dependency scan
        working-directory: backend
        run: snyk test --severity-threshold=high --file=requirements.txt --package-manager=pip --command=python3

  docker:
    runs-on: ubuntu-latest
    needs: [security, snyk]
    if: ${{ !cancelled() && needs.security.result == 'success' && (needs.snyk.result == 'success' || needs.snyk.result == 'skipped') }}
    strategy:
      matrix:
        image:
          - name: noteos-web
            context: ./frontend
            file: ./frontend/Dockerfile
          - name: noteos-api
            context: ./backend
            file: ./backend/Dockerfile
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build both architectures
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          platforms: linux/amd64,linux/arm64
          # Keep publication disabled, including after a merge to main.
          push: false
          tags: ${{ matrix.image.name }}:ci
      - name: Build local image for Trivy
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          platforms: linux/amd64
          load: true
          tags: ${{ matrix.image.name }}:scan
      - name: Check API container imports without AWS
        if: ${{ matrix.image.name == 'noteos-api' }}
        run: docker run --rm --entrypoint python noteos-api:scan -c "from app.main import app; print(app.title)"
      - name: Check frontend container serves the preview
        if: ${{ matrix.image.name == 'noteos-web' }}
        run: |
          docker run --detach --name noteos-web-smoke --publish 127.0.0.1:3050:3050 noteos-web:scan
          trap 'docker rm --force noteos-web-smoke' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3050/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs noteos-web-smoke
          exit 1
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          image-ref: ${{ matrix.image.name }}:scan
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  terraform:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        root: [infra/terraform, infra/terraform/ci-bootstrap]
    defaults:
      run:
        working-directory: ${{ matrix.root }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate
      - name: Verify deployment stays locked without AWS access
        # Both test files use mock_provider and plan only; no real AWS plans/applies.
        run: terraform test -filter=tests/deployment_lock.tftest.hcl -no-color

  ci-gate:
    # Keep this name stable: the default-branch ruleset requires this check.
    if: ${{ always() }}
    needs: [web, api, security, snyk, docker, terraform]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      JOB_RESULTS: ${{ toJSON(needs) }}
    steps:
      - name: Require every validation job to pass
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          results = json.loads(os.environ["JOB_RESULTS"])
          failed = []
          for job in ("web", "api", "security", "snyk", "docker", "terraform"):
              result = results.get(job, {}).get("result", "missing")
              # Snyk needs trusted main-only SSM access; PRs deliberately skip it.
              allowed = {"success", "skipped"} if job == "snyk" else {"success"}
              print(f"{job}: {result}")
              if result not in allowed:
                  failed.append(job)
          if failed:
              print(f"::error::Validation did not pass: {', '.join(failed)}")
              sys.exit(1)
          PY

  # ECS CD is intentionally not enabled. Keep apply, ECR publication, and ECS
  # service updates out of this validation workflow. See infra/DEPLOYMENT.md.
  # The future EKS example below must remain commented until separately reviewed.
  # cd-argocd:
