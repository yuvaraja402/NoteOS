services:
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:8000}
      PORT: "3050"
      HOSTNAME: 0.0.0.0
    ports:
      - "127.0.0.1:3050:3050"

  # Opt-in cloud API. No local database or cache containers are provided.
  # AWS credentials come from the mounted local AWS profile, never image layers.
  api:
    profiles: [cloud]
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      NOTEOS_ENV: local
      AWS_REGION: ${AWS_REGION:-ca-central-1}
      AWS_PROFILE: ${AWS_PROFILE:-default}
      AWS_SHARED_CREDENTIALS_FILE: /aws/credentials
      AWS_CONFIG_FILE: /aws/config
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3050}
      DYNAMODB_TABLE_NAME: ${DYNAMODB_TABLE_NAME:-}
      REDIS_HOST: ${REDIS_HOST:-}
      REDIS_AUTH_TOKEN_SSM_PARAM: ${REDIS_AUTH_TOKEN_SSM_PARAM:-}
      SESSION_SIGNING_KEY_SSM_PARAM: ${SESSION_SIGNING_KEY_SSM_PARAM:-}
      FLUSH_IDLE_SECONDS: ${FLUSH_IDLE_SECONDS:-60}
      FLUSH_MAX_SECONDS: ${FLUSH_MAX_SECONDS:-300}
    volumes:
      - type: bind
        source: ${AWS_CONFIG_DIRECTORY:-${HOME}/.aws}
        target: /aws
        read_only: true
    ports:
      - "127.0.0.1:8000:8000"
