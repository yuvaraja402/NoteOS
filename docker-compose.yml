services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?set POSTGRES_USER in .env} -d ${POSTGRES_DB:?set POSTGRES_DB in .env}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - noteos-db:/var/lib/postgresql/data

  api:
    build:
      context: ./backend
    environment:
      NOTEOS_ENV: ${NOTEOS_ENV:-local}
      AWS_REGION: ${AWS_REGION:-ca-central-1}
      CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS in .env}
      NOTEOS_DATABASE_URL: ${NOTEOS_DATABASE_URL:?set NOTEOS_DATABASE_URL in .env}
      NOTEOS_DATABASE_URL_SSM_PARAM: ${NOTEOS_DATABASE_URL_SSM_PARAM:-}
      RUN_MIGRATIONS: "true"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      API_INTERNAL_URL: ${API_INTERNAL_URL:?set API_INTERNAL_URL in .env}
      PORT: "3050"
      HOSTNAME: 0.0.0.0
    depends_on:
      - api
    ports:
      - "127.0.0.1:3050:3050"

volumes:
  noteos-db:
